name: Deploy theme and plugins

# Retrigger deploy after FTP secrets were added.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./themes/ministry-mines/
          server-dir: /public_html/wp-content/themes/ministry-mines/

      - name: Deploy Ministry Content
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./plugins/ministry-content/
          server-dir: /public_html/wp-content/plugins/ministry-content/

      - name: Deploy Ministry Engage
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./plugins/ministry-engage/
          server-dir: /public_html/wp-content/plugins/ministry-engage/

      # Unique state-name so this step cannot sync-delete WordPress core in /public_html/.
      - name: Deploy PHP upload limits
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/public_html/
          server-dir: /public_html/
          state-name: .ftp-deploy-userini-state.json
